name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer
        shell: powershell
        run: .\tests\Test-Installer.ps1
      - name: Exercise dry run
        shell: powershell
        run: .\install.ps1 -DryRun -SkipLogin -SkipPathUpdate
      - name: Test first-run WSL discovery and Git Bash shim
        shell: powershell
        run: .\tests\Test-Windows.ps1
  linux-forwarder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export generated scripts
        shell: pwsh
        run: ./tests/Test-Installer.ps1 -ExportScripts .test-output -FixtureExecutable "$env:RUNNER_TEMP/clay test/user's cli"
      - name: Verify shell syntax and forwarding behavior
        shell: bash
        run: bash tests/Test-Forwarder.sh .test-output "$RUNNER_TEMP/clay test/user's cli"
