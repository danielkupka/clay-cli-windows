name: test

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

jobs:
  maintenance-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
  upstream:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.workflow == 'test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect upstream changes and published installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Check-Upstream.ps1
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Validate installer
        shell: powershell
        run: .\tests\Test-Installer.ps1
      - name: Exercise dry run
        shell: powershell
        run: .\install.ps1 -DryRun -SkipLogin -SkipPathUpdate
      - name: Test first-run WSL discovery and Git Bash shim
        shell: powershell
        run: .\tests\Test-Windows.ps1
  linux-forwarder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Export generated scripts
        shell: pwsh
        run: ./tests/Test-Installer.ps1 -ExportScripts .test-output -FixtureExecutable "$env:RUNNER_TEMP/clay test/user's cli"
      - name: Verify shell syntax and forwarding behavior
        shell: bash
        run: bash tests/Test-Forwarder.sh .test-output "$RUNNER_TEMP/clay test/user's cli"
